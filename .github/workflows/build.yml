name: Build Native Lib
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download NDK
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r25c-linux.zip
          unzip -q android-ndk-r25c-linux.zip
      - name: Build libs
        run: |
          NDK=$PWD/android-ndk-r25c
          TOOLCHAIN=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin
          mkdir -p libs/arm64-v8a libs/armeabi-v7a
          $TOOLCHAIN/aarch64-linux-android21-clang -shared -fPIC native-lib.cpp -o libs/arm64-v8a/libnative-lib.so
          $TOOLCHAIN/armv7a-linux-androideabi21-clang -shared -fPIC native-lib.cpp -o libs/armeabi-v7a/libnative-lib.so
      - uses: actions/upload-artifact@v4
        with:
          name: native-libs
          path: libs/
