name: Build Native Lib
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-ndk@v1
        with:
          ndk-version: r25c
      - name: Build arm64-v8a and armeabi-v7a
        run: |
          mkdir -p libs/arm64-v8a libs/armeabi-v7a
          $ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang -shared -fPIC native-lib.cpp -o libs/arm64-v8a/libnative-lib.so
          $ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi21-clang -shared -fPIC native-lib.cpp -o libs/armeabi-v7a/libnative-lib.so
      - uses: actions/upload-artifact@v4
        with:
          name: native-libs
          path: libs/
